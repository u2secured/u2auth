[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "u2auth"
version = "0.1.0"
description = "U2Auth SDK for Python — TOTP verification, push approvals, and local TOTP helpers"
authors = [{ name = "DollarMates Dev", email = "dev@dollarmates.com" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["2fa", "mfa", "totp", "push", "authentication", "u2secured"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://auth.u2secured.com/developer/docs"
Source = "https://github.com/u2secured/u2auth"
Issues = "https://github.com/u2secured/u2auth/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0", "twine>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["u2auth*"]

[tool.setuptools.package-data]
u2auth = ["py.typed"]
